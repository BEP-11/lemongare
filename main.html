<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDMessenger — Red Dark Messenger</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-hover: #222222;
            --bg-active: #2a2a2a;
            --red-primary: #e53935;
            --red-secondary: #ff5252;
            --red-dark: #b71c1c;
            --red-accent: #ff1744;
            --red-glow: rgba(229, 57, 53, 0.3);
            --red-subtle: rgba(229, 57, 53, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #666666;
            --border-color: #2a2a2a;
            --message-out: #2d1a1a;
            --message-in: #1a1a1a;
            --online-green: #4caf50;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== AUTH SCREEN ===== */
        .auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
.auth-screen::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(229, 57, 53, 0.08) 0%, transparent 60%);
            animation: pulse-bg 8s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 420px;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 48px 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(229, 57, 53, 0.05);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .auth-logo .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(229, 57, 53, 0.3);
        }

        .auth-logo h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--red-primary), var(--red-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 11px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: var(--red-primary);
            color: white;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px var(--red-subtle);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(229, 57, 53, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .auth-error {
            color: var(--red-secondary);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .auth-success {
            color: #4caf50;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* ===== MAIN APP LAYOUT ===== */
        .app-screen {
            display: none;
            height: 100vh;
        }

        .app-screen.active {
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 360px;
            min-width: 360px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            min-height: 64px;
        }

        .sidebar-header .menu-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
        }

        .sidebar-header .menu-btn:hover {
            background: var(--bg-hover);
        }

        .sidebar-header .app-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--red-primary), var(--red-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-header .header-actions {
            display: flex;
            gap: 4px;
        }

        .search-container {
            padding: 12px 16px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-box:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px var(--red-subtle);
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 2px;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-item.active {
            background: var(--red-subtle);
        }

        .chat-item.unread .chat-item-name {
            color: var(--text-primary);
            font-weight: 600;
        }

        .chat-item.unread .chat-item-preview {
            color: var(--text-secondary);
        }

        .chat-item.unread .chat-item-time {
            color: var(--red-primary);
        }

        .unread-badge {
            background: var(--red-primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            margin-right: 14px;
            flex-shrink: 0;
            position: relative;
        }

        .chat-avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            background: var(--online-green);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }

        .chat-item-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-item-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .chat-item-time {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .chat-item-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== MAIN CHAT AREA ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        .main-chat::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(229, 57, 53, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(229, 57, 53, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        .chat-header {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1;
            min-height: 64px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
        }

        .chat-header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 14px;
        }

        .chat-header-avatar .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: var(--online-green);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }

        .chat-header-avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .chat-header-details h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-header-details span {
            font-size: 13px;
            color: var(--online-green);
        }

        .chat-header-actions {
            display: flex;
            gap: 4px;
        }

        .header-action-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .header-action-btn:hover {
            background: var(--bg-hover);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 60px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 1;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        .message-group-start {
            margin-top: 16px;
        }

        .message-date-divider {
            text-align: center;
            margin: 16px 0;
        }

        .message-date-divider span {
            background: rgba(42, 42, 42, 0.8);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .message-wrapper {
            display: flex;
            margin-bottom: 2px;
        }

        .message-wrapper.sent {
            justify-content: flex-end;
        }

        .message-wrapper.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 480px;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message-wrapper.sent .message-bubble {
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 12px rgba(229, 57, 53, 0.2);
        }

        .message-wrapper.received .message-bubble {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 6px;
        }

        .message-bubble .msg-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .message-wrapper.sent .message-bubble .msg-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .message-status {
            margin-left: 4px;
            font-size: 12px;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1;
        }

        .input-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            flex-shrink: 0;
        }

        .input-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .message-input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px var(--red-subtle);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(229, 57, 53, 0.4);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .empty-state-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--red-subtle), rgba(229, 57, 53, 0.05));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin-bottom: 24px;
        }

        .empty-state h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== SIDEBAR MENU (PROFILE) ===== */
        .sidebar-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-menu-overlay.active {
            display: block;
            opacity: 1;
        }

        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100vh;
            background: var(--bg-secondary);
            z-index: 101;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-menu.active {
            left: 0;
        }

        .menu-profile {
            padding: 28px 24px;
            background: linear-gradient(135deg, rgba(229, 57, 53, 0.15), rgba(229, 57, 53, 0.05));
            border-bottom: 1px solid var(--border-color);
        }

        .menu-profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            box-shadow: 0 4px 20px rgba(229, 57, 53, 0.3);
        }

        .menu-profile h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-profile p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .menu-items {
            flex: 1;
            padding: 12px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 24px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 16px;
            font-size: 15px;
            color: var(--text-primary);
        }

        .menu-item:hover {
            background: var(--bg-hover);
        }

        .menu-item .menu-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            color: var(--red-primary);
        }

        .menu-item.logout {
            color: var(--red-secondary);
        }

        .menu-item.logout .menu-icon {
            color: var(--red-secondary);
        }

        /* ===== PROFILE MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 400px;
            max-width: 90vw;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
        }

        .modal-close:hover {
            background: var(--bg-hover);
        }

        .modal-body {
            padding: 24px;
        }

        .profile-card {
            text-align: center;
            margin-bottom: 24px;
        }

        .profile-card .p-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            box-shadow: 0 4px 24px rgba(229, 57, 53, 0.3);
            margin-bottom: 16px;
        }

        .profile-card h4 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-card p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== NEW CHAT MODAL ===== */
        .new-chat-search {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
        }

        .new-chat-search:focus {
            border-color: var(--red-primary);
        }

        .contact-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
        }

        .contact-item:hover {

        /* ===== TOAST ===== */

            right: 20px;
            z-index: 300;

        .toast {
            padding: 14px 20px;

        .toast.success {
            background: #1b5e20;
            color: #c8e6c9;

        .toast.error {
            background: var(--red-dark);
            color: #ffcdd2;
            border: 1px solid var(--red-primary);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }

        /* ===== TYPING INDICATOR ===== */

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-width: 100%;
            }

            .main-chat {
                position: fixed;
                inset: 0;
                z-index: 50;

            }

            .main-chat.mobile-active {

        .back-btn {

        /* Profile edit fields */

        /* Notification dot */

            animation: notifPulse 2s infinite;

        @keyframes notifPulse {
            0%, 100% { opacity: 1; }

    </style>
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->

<script>
// ============================================================
// DATABASE (localStorage)
// ============================================================
const DB = {
    getUsers() {
        return JSON.parse(localStorage.getItem('rdm_users') || '{}');
    },
    saveUsers(users) {
        localStorage.setItem('rdm_users', JSON.stringify(users));
    },
    getMessages() {
        return JSON.parse(localStorage.getItem('rdm_messages') || '{}');
    },
    saveMessages(msgs) {
        localStorage.setItem('rdm_messages', JSON.stringify(msgs));
    },
    getCurrentUser() {
        const data = sessionStorage.getItem('rdm_current_user');
        return data ? JSON.parse(data) : null;
    },
    setCurrentUser(user) {
        if (user) sessionStorage.setItem('rdm_current_user', JSON.stringify(user));
        else sessionStorage.removeItem('rdm_current_user');
    },
    getActiveChats() {
        const user = this.getCurrentUser();
        if (!user) return {};
        return JSON.parse(localStorage.getItem(`rdm_active_${user.username}`) || '{}');
    },
    saveActiveChats(chats) {
        const user = this.getCurrentUser();
        if (!user) return;
        localStorage.setItem(`rdm_active_${user.username}`, JSON.stringify(chats));
    }
};

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentChatId = null;
let selectedAvatarColor = 0;

const AVATAR_COLORS = [
    'linear-gradient(135deg, #e53935, #b71c1c)',
    'linear-gradient(135deg, #ff5252, #d32f2f)',
    'linear-gradient(135deg, #ff1744, #c62828)',
    'linear-gradient(135deg, #ff6e40, #dd2c00)',
    'linear-gradient(135deg, #ff3d00, #bf360c)',
    'linear-gradient(135deg, #a50000, #7f0000)',
];

const BOT_CONTACTS = [
    { id: 'bot_alex', username: 'alex_dev', displayName: 'Алексей Dev', bio: 'Full-stack разработчик 🚀', online: true },
    { id: 'bot_maria', username: 'maria_design', displayName: 'Мария Designer', bio: 'UI/UX дизайнер ✨', online: true },
    { id: 'bot_dmitry', username: 'dmitry_pm', displayName: 'Дмитрий PM', bio: 'Project Manager 📋', online: false },
    { id: 'bot_sofia', username: 'sofia_data', displayName: 'София Analyst', bio: 'Data Scientist 📊', online: false },
    { id: 'bot_ivan', username: 'ivan_crypto', displayName: 'Иван Crypto', bio: 'Blockchain developer 🔗', online: true },
];

const AUTO_REPLIES = [
    "Привет! Как дела? 😊",
    "Отличная идея!",
    "Давай обсудим позже",
    "Интересно, расскажи подробнее",
    "Согласен! 💯",
    "Хорошо, понял 👍",
    "Ок, сделаю ASAP",
    "Круто! 🔥",
    "Нужно подумать над этим",
    "Да, конечно!",
    "Спасибо за информацию!",
    "Буду через 5 минут",
    "Отправь мне документы",
    "Давай созвонимся завтра?",
    "Уже в процессе работы 🛠️",
    "Это действительно круто!",
    "Посмотри мой новый проект",
    "Как ты это сделал? 😮",
    "Встретимся вечером?",
    "Переслал тебе файлы"
];

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
    currentUser = DB.getCurrentUser();
    
    // Seed some default contacts if none exist
    const users = DB.getUsers();
    if (Object.keys(users).length === 0) {
        BOT_CONTACTS.forEach(c => {
            users[c.username] = {
                username: c.username,
                displayName: c.displayName,
                bio: c.bio,
                password: '', // demo
                online: c.online,
                avatarColor: Math.floor(Math.random() * AVATAR_COLORS.length),
                registeredAt: Date.now() - Math.random() * 10000000
            };
        });
        DB.saveUsers(users);
    }

    if (currentUser) {
        showApp();
    } else {
        showAuth();
    }
}

// ============================================================
// AUTH FUNCTIONS
// ============================================================
function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    
    if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
    } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
    }
    
    // Clear messages
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('registerError').style.display = 'none';
    document.getElementById('registerSuccess').style.display = 'none';
}

function handleRegister(e) {
    e.preventDefault();
    const displayName = document.getElementById('regDisplayName').value.trim();
    const username = document.getElementById('regUsername').value.trim().toLowerCase();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const bio = document.getElementById('regBio').value.trim();

    if (!displayName || !username || !email || !password) {
        showAuthError('registerError', 'Заполните все обязательные поля');
        return;
    }

    if (password.length < 6) {
        showAuthError('registerError', 'Пароль должен быть минимум 6 символов');
        return;
    }

    const users = DB.getUsers();
    
    if (users[username]) {
        showAuthError('registerError', 'Имя пользователя уже занято');
        return;
    }

    // Check email uniqueness
    for (const key in users) {
        if (users[key].email === email) {
            showAuthError('registerError', 'Email уже зарегистрирован');
            return;
        }
    }

    users[username] = {
        username,
        displayName,
        email,
        password,
        bio: bio || '',
        online: true,
        avatarColor: Math.floor(Math.random() * AVATAR_COLORS.length),
        registeredAt: Date.now()
    };

    DB.saveUsers(users);
    
    document.getElementById('registerError').style.display = 'none';
    const successEl = document.getElementById('registerSuccess');
    successEl.textContent = 'Аккаунт создан! Переходим к входу...';
    successEl.style.display = 'block';

    showToast('Регистрация успешна!', 'success');

    setTimeout(() => {
        switchAuthTab('login');
        document.getElementById('loginUsername').value = username;
        document.getElementById('regBio').value = '';
        document.getElementById('regPassword').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regDisplayName').value = '';
        document.getElementById('regUsername').value = '';
        successEl.style.display = 'none';
    }, 1500);
}

function handleLogin(e) {
    e.preventDefault();
    const input = document.getElementById('loginUsername').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;

    if (!input || !password) {
        showAuthError('loginError', 'Заполните все поля');
        return;
    }

    const users = DB.getUsers();
    let foundUser = null;
    
    if (users[input]) {
        foundUser = users[input];
        if (foundUser.password !== password) {
            showAuthError('loginError', 'Неверный пароль');
            return;
        }
    } else {
        showAuthError('loginError', 'Пользователь не найден');
        return;
    }

    currentUser = foundUser;
    DB.setCurrentUser(currentUser);
    
    // Mark online
    foundUser.online = true;
    users[input] = foundUser;
    DB.saveUsers(users);

    showToast(`Добро пожаловать, ${currentUser.displayName}!`, 'success');
    showApp();
}

function handleLogout() {
    const users = DB.getUsers();
    if (users[currentUser.username]) {
        users[currentUser.username].online = false;
        DB.saveUsers(users);
    }
    
    currentUser = null;
    DB.setCurrentUser(null);
    currentChatId = null;
    
    closeSidebarMenu();
    showAuth();
    showToast('Вы вышли из аккаунта', 'success');
}

function showAuthError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}

// ============================================================
// SCREENS
// ============================================================
function showAuth() {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').classList.remove('active');
}

function showApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('active');
    
    updateMenuProfile();
    renderChatList();
}

// ============================================================
// SIDEBAR MENU
// ============================================================
function openSidebarMenu() {
    document.getElementById('sidebarMenu').classList.add('active');
    document.getElementById('menuOverlay').classList.add('active');
}

function closeSidebarMenu() {
    document.getElementById('sidebarMenu').classList.remove('active');
    document.getElementById('menuOverlay').classList.remove('active');
}

function updateMenuProfile() {
    if (!currentUser) return;
    
    const initials = currentUser.displayName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    
    document.getElementById('menuAvatar').textContent = initials || '👤';
    document.getElementById('menuAvatar').style.background = AVATAR_COLORS[currentUser.avatarColor % AVATAR_COLORS.length];
    document.getElementById('menuName').textContent = currentUser.displayName;
    document.getElementById('menuBio').textContent = currentUser.bio || currentUser.username;
}

// ============================================================
// CHAT LIST
// ============================================================
function getContacts() {
    const users = DB.getUsers();
    let contacts = [...BOT_CONTACTS];
    
    // Add real registered users (excluding bot ones)
    for (const key in users) {
        if (!contacts.find(c => c.username === key)) {
            contacts.push({
                id: key,
                username: key,
                displayName: users[key].displayName,
                bio: users[key].bio || '',
                online: users[key].online,
                avatarColor: users[key].avatarColor || 0
            });
        }
    }
    
    return contacts;
}

function getMessagesForChat(chatId) {
    const allMsgs = DB.getMessages();
    const key = Object.keys(allMsgs).find(k => 
        k.includes(currentChatKey(currentUser?.username || '', chatId)) ||
        k.includes(currentChatKey(chatId, currentUser?.username || ''))
    );
    
    if (!key) return [];
    return allMsgs[key] || [];
}

function currentChatKey(a, b) {
    return [a, b].sort().join('_');
}

function renderChatList() {
    const container = document.getElementById('chatList');
    const contacts = getContacts();
    const searchQuery = (document.getElementById('chatSearch')?.value || '').toLowerCase();
    
    if (!currentUser) return;
    
    // Get recent chat data
    const activeChats = DB.getActiveChats();
    
    let html = '';
    let firstOnlineFound = false;

    contacts.forEach(contact => {
        if (contact.id === currentUser.username && currentUser.username !== 'bot_alex') return;
        
        const chatKey = currentChatKey(currentUser.username, contact.id);
        const chatData = activeChats[chatKey] || {};
        const msgs = getMessagesForChat(contact.id);
        const lastMsg = msgs[msgs.length - 1];
        
        // Filter by search
        if (searchQuery && !contact.displayName.toLowerCase().includes(searchQuery) && 
            !contact.username.toLowerCase().includes(searchQuery)) return;
        
        const unreadCount = chatData.unread || 0;
        
        const initials = contact.displayName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const colorIdx = (contact.avatarColor !== undefined) ? contact.avatarColor : 
            contact.id.charCodeAt(0) % AVATAR_COLORS.length;
        
        const isOnline = contact.online;
        const preview = lastMsg ? (lastMsg.sender === currentUser.username ? 'Вы: ' : '') + lastMsg.text : 'Начните общение...';
        const timeStr = lastMsg ? formatTime(lastMsg.timestamp) : '';
        
        if (!firstOnlineFound && isOnline) firstOnlineFound = true;

        html += `
            <div class="chat-item ${currentChatId === contact.id ? 'active' : ''} ${unreadCount > 0 ? 'unread' : ''}" 
                 onclick="openChat('${contact.id}', '${contact.displayName.replace(/'/g, "\\'")}')">
                <div class="chat-avatar" style="background: ${AVATAR_COLORS[colorIdx % AVATAR_COLORS.length]}">
                    ${initials}
                    ${isOnline ? '<div class="online-dot"></div>' : ''}
                </div>
                <div class="chat-item-info">
                    <div class="chat-item-top">
                        <span class="chat-item-name">${contact.displayName}</span>
                        <span class="chat-item-time">${timeStr}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span class="chat-item-preview">${escapeHtml(preview)}</span>
                        ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--text-muted);">Нет чатов</div>';
}

function filterChats() {
    renderChatList();
}

// ============================================================
// OPEN CHAT
// ============================================================
function openChat(contactId, contactName) {
    currentChatId = contactId;
    
    // Update header
    const contacts = getContacts();
    const contact = contacts.find(c => c.id === contactId);
    
    if (contact) {
        const initials = contact.displayName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const colorIdx = (contact.avatarColor !== undefined) ? contact.avatarColor : 
            contact.id.charCodeAt(0) % AVATAR_COLORS.length;
        
        document.getElementById('chatHeaderAvatar').textContent = initials;
        document.getElementById('chatHeaderAvatar').style.background = AVATAR_COLORS[colorIdx % AVATAR_COLORS.length];
        document.getElementById('chatHeaderName').textContent = contact.displayName;
        
        const onlineEl = document.getElementById('chatHeaderOnline');
        const statusEl = document.getElementById('chatHeaderStatus');
        
        if (contact.online) {
            onlineEl.style.display = 'block';
            statusEl.textContent = 'в сети';
            statusEl.style.color = 'var(--online-green)';
        } else {
            onlineEl.style.display = 'none';
            statusEl.textContent = 'был(а) недавно';
            statusEl.style.color = 'var(--text-muted)';
        }
    }

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';

    // Mobile
    document.getElementById('mainChat').classList.add('mobile-active');

    // Clear unread
    const chatKey = currentChatKey(currentUser.username, contactId);
    const activeChats = DB.getActiveChats();
    if (activeChats[chatKey]) {
        activeChats[chatKey].unread = 0;
        DB.saveActiveChats(activeChats);
    }

    renderMessages();
    renderChatList();
    
    setTimeout(() => {
        document.getElementById('messageInput').focus();
    }, 100);
}

function goBack() {
    document.getElementById('mainChat').classList.remove('mobile-active');
    currentChatId = null;
}

// ============================================================
// MESSAGES
// ============================================================
function renderMessages() {
    if (!currentChatId || !currentUser) return;
    
    const area = document.getElementById('messagesArea');
    const msgs = getMessagesForChat(currentChatId);
    
    if (msgs.length === 0) {
        const contacts = getContacts();
        const contact = contacts.find(c => c.id === currentChatId);
        const name = contact ? contact.displayName : 'контакт';
        
        area.innerHTML = `
            <div style="text-align:center;padding:60px 20px;color:var(--text-muted);">
                <div style="font-size:48px;margin-bottom:16px;">🔥</div>
                <p style="font-size:15px;">Начните разговор с ${escapeHtml(name)}</p>
            </div>
        `;
        return;
    }

    let html = '';
    let lastDate = '';
    
    msgs.forEach((msg, i) => {
        const msgDate = new Date(msg.timestamp).toLocaleDateString('ru-RU', { 
            day: 'numeric', month: 'long', year: 'numeric' 
        });
        
        if (msgDate !== lastDate) {
            html += `<div class="message-date-divider"><span>${msgDate}</span></div>`;
            lastDate = msgDate;
        }
        
        const isSent = msg.sender === currentUser.username;
        const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        
        html += `
            <div class="message-wrapper ${isSent ? 'sent' : 'received'} ${i === 0 || msgs[i-1].sender !== msg.sender ? 'message-group-start' : ''}">
                <div class="message-bubble">
                    ${escapeHtml(msg.text)}
                    <div class="msg-time">${time}${isSent ? ` <span class="message-status">✓✓</span>` : ''}</div>
                </div>
            </div>
        `;
    });

    area.innerHTML = html;
    
    // Scroll to bottom
    setTimeout(() => {
        area.scrollTop = area.scrollHeight;
    }, 50);
}

function sendMessage() {
    if (!currentChatId || !currentUser) return;
    
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;
    
    const msg = {
        id: Date.now(),
        sender: currentUser.username,
        text: text,
        timestamp: Date.now(),
        status: 'sent'
    };
    
    // Save message
    const allMsgs = DB.getMessages();
    const chatKey = currentChatKey(currentUser.username, currentChatId);
    
    if (!allMsgs[chatKey]) allMsgs[chatKey] = [];
    allMsgs[chatKey].push(msg);
    DB.saveMessages(allMsgs);
    
    // Update active chats
    const contacts = getContacts();
    const contact = contacts.find(c => c.id === currentChatId);
    const activeChats = DB.getActiveChats();
    
    const myKey = currentChatKey(currentUser.username, currentChatId);
    if (!activeChats[myKey]) {
        activeChats[myKey] = { lastMessage: text, timestamp: Date.now(), unread: 0 };
    }
    activeChats[myKey].lastMessage = text;
    activeChats[myKey].timestamp = Date.now();
    DB.saveActiveChats(activeChats);

    input.value = '';
    renderMessages();
    renderChatList();
    
    // Simulate bot reply
    simulateReply(currentChatId);
}

function handleMessageKey(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
}

// ============================================================
// AUTO REPLY SIMULATION
// ============================================================
let replyTimers = {};

function simulateReply(contactId) {
    if (replyTimers[contactId]) clearTimeout(replyTimers[contactId]);
    
    const showTyping = () => {
        if (currentChatId === contactId) {
            document.getElementById('typingIndicator').classList.add('active');
        }
    };
    
    const hideTyping = () => {
        document.getElementById('typingIndicator').classList.remove('active');
    };
    
    // Show typing after 1-2s
    replyTimers[contactId] = setTimeout(() => {
        if (currentChatId !== contactId) return;
        showTyping();
        
        const delay = 1500 + Math.random() * 2000;
        
        setTimeout(() => {
            hideTyping();
            
            const replyMsg = {
                id: Date.now() + 1,
                sender: contactId,
                text: AUTO_REPLIES[Math.floor(Math.random() * AUTO_REPLIES.length)],
                timestamp: Date.now(),
                status: 'received'
            };
            
            const allMsgs = DB.getMessages();
            const chatKey = currentChatKey(currentUser.username, contactId);
            
            if (!allMsgs[chatKey]) allMsgs[chatKey] = [];
            allMsgs[chatKey].push(replyMsg);
            DB.saveMessages(allMsgs);
            
            // Update active chats with unread if not in chat
            const activeChats = DB.getActiveChats();
            const theirKey = currentChatKey(contactId, currentUser.username);
            if (currentChatId === contactId) {
                activeChats[theirKey] = { lastMessage: replyMsg.text, timestamp: Date.now(), unread: 0 };
            } else {
                if (!activeChats[theirKey]) activeChats[theirKey] = { lastMessage: replyMsg.text, timestamp: Date.now(), unread: 0 };
                activeChats[theirKey].unread = (activeChats[theirKey].unread || 0) + 1;
            }
            DB.saveActiveChats(activeChats);
            
            if (currentChatId === contactId) {
                renderMessages();
            }
            renderChatList();
        }, delay);
    }, 1000 + Math.random() * 1500);
}

// ============================================================
// PROFILE MODAL
// ============================================================
function openProfileModal() {
    closeSidebarMenu();
    
    const body = document.getElementById('profileModalBody');
    const initials = currentUser.displayName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    
    body.innerHTML = `
        <div class="profile-card">
            <div class="p-avatar" id="editAvatar" style="background:${AVATAR_COLORS[currentUser.avatarColor % AVATAR_COLORS.length]}">${initials}</div>
            <h4 id="editNameDisplay">${currentUser.displayName}</h4>
            <p>@${currentUser.username}</p>
        </div>
        <div class="profile-edit-field">
            <label>Имя</label>
            <input type="text" id="editDisplayName" value="${currentUser.displayName}">
        </div>
        <div class="profile-edit-field">
            <label>О себе</label>
            <input type="text" id="editBio" value="${currentUser.bio || ''}">
        </div>
        <button class="btn-primary" onclick="saveProfile()" style="margin-top:8px;">Сохранить</button>
        <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-color);">
            <p style="font-size:12px;color:var(--text-muted);">Ваш ID: ${currentUser.username}</p>
            <p style="font-size:12px;color:var(--text-muted);">Настроен на красный стиль 🔥</p>
        </div>
    `;
    
    document.getElementById('profileModal').classList.add('active');
}

function closeProfileModal() {
    document.getElementById('profileModal').classList.remove('active');
}

function saveProfile() {
    const newName = document.getElementById('editDisplayName').value.trim();
    const newBio = document.getElementById('editBio').value.trim();
    
    if (!newName) return;
    
    currentUser.displayName = newName;
    currentUser.bio = newBio;
    
    const users = DB.getUsers();
    users[currentUser.username] = currentUser;
    DB.saveUsers(users);
    
    closeProfileModal();
    updateMenuProfile();
    renderChatList();
    showToast('Профиль обновлён!', 'success');
}

// ============================================================
// NEW CHAT MODAL
// ============================================================
function openNewChatModal() {
    closeSidebarMenu();
    document.getElementById('newChatSearch').value = '';
    renderContactList();
    document.getElementById('newChatModal').classList.add('active');
}

function closeNewChatModal() {
    document.getElementById('newChatModal').classList.remove('active');
}

function renderContactList(filter = '') {
    const container = document.getElementById('contactList');
    const contacts = getContacts().filter(c => c.id !== currentUser?.username);
    
    let html = '';
    contacts.forEach(contact => {
        if (filter && !contact.displayName.toLowerCase().includes(filter.toLowerCase()) &&
            !contact.username.toLowerCase().includes(filter.toLowerCase())) return;
            
        const initials = contact.displayName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const colorIdx = (contact.avatarColor !== undefined) ? contact.avatarColor : 
            contact.id.charCodeAt(0) % AVATAR_COLORS.length;
        
        html += `
            <div class="contact-item" onclick="startChat('${contact.id}', '${escapeAttr(contact.displayName)}')">
                <div class="contact-avatar" style="background:${AVATAR_COLORS[colorIdx % AVATAR_COLORS.length]}">${initials}</div>
                <div>
                    <div class="contact-name">${escapeHtml(contact.displayName)}</div>
                    <div class="contact-status">${contact.online ? '🟢 в сети' : '⚫ не в сети'}</div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html || '<div style="text-align:center;padding:20px;color:var(--text-muted);">Никого не найдено</div>';
}

function filterContacts() {
    const val = document.getElementById('newChatSearch').value;
    renderContactList(val);
}

function startChat(contactId, contactName) {
    closeNewChatModal();
    
    // Mark as online for demo purposes
    const users = DB.getUsers();
    if (users[contactId]) users[contactId].online = true;
    DB.saveUsers(users);
    
    renderChatList();
    openChat(contactId, contactName);
    showToast(`Чат с ${contactName} открыт`, 'success');
}

// ============================================================
// UTILITIES
// ============================================================
function formatTime(timestamp) {
    const d = new Date(timestamp);
    const now = new Date();
    
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }
    
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'вчера';
    
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function escapeAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    
    setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 3000);
}

// ============================================================
// PERIODIC REFRESH (for online status changes)
// ============================================================
setInterval(() => {
    if (currentUser) {
        renderChatList();
    }
}, 10000);

// ============================================================
// INIT
// ============================================================
init();
</script>
