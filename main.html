<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDMessenger — Red Dark Messenger</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-hover: #222222;
            --bg-active: #2a2a2a;
            --red-primary: #e53935;
            --red-secondary: #ff5252;
            --red-dark: #b71c1c;
            --red-accent: #ff1744;
            --red-glow: rgba(229, 57, 53, 0.3);
            --red-subtle: rgba(229, 57, 53, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #666666;
            --border-color: #2a2a2a;
            --message-out: #2d1a1a;
            --message-in: #1a1a1a;
            --online-green: #4caf50;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== AUTH SCREEN ===== */
        .auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
.auth-screen::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(229, 57, 53, 0.08) 0%, transparent 60%);
            animation: pulse-bg 8s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 420px;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 48px 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(229, 57, 53, 0.05);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .auth-logo .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(229, 57, 53, 0.3);
        }

        .auth-logo h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--red-primary), var(--red-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 11px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: var(--red-primary);
            color: white;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px var(--red-subtle);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(229, 57, 53, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .auth-error {
            color: var(--red-secondary);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .auth-success {
            color: #4caf50;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* ===== MAIN APP LAYOUT ===== */
        .app-screen {
            display: none;
            height: 100vh;
        }

        .app-screen.active {
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 360px;
            min-width: 360px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            min-height: 64px;
        }

        .sidebar-header .menu-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
        }

        .sidebar-header .menu-btn:hover {
            background: var(--bg-hover);
        }

        .sidebar-header .app-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--red-primary), var(--red-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-header .header-actions {
            display: flex;
            gap: 4px;
        }

        .search-container {
            padding: 12px 16px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-box:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px var(--red-subtle);
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 2px;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-item.active {
            background: var(--red-subtle);
        }

        .chat-item.unread .chat-item-name {
            color: var(--text-primary);
            font-weight: 600;
        }

        .chat-item.unread .chat-item-preview {
            color: var(--text-secondary);
        }

        .chat-item.unread .chat-item-time {
            color: var(--red-primary);
        }

        .unread-badge {
            background: var(--red-primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            margin-right: 14px;
            flex-shrink: 0;
            position: relative;
        }

        .chat-avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            background: var(--online-green);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }

        .chat-item-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-item-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .chat-item-time {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .chat-item-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== MAIN CHAT AREA ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        .main-chat::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(229, 57, 53, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(229, 57, 53, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        .chat-header {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1;
            min-height: 64px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
        }

        .chat-header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 14px;
        }

        .chat-header-avatar .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: var(--online-green);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }

        .chat-header-avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .chat-header-details h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-header-details span {
            font-size: 13px;
            color: var(--online-green);
        }

        .chat-header-actions {
            display: flex;
            gap: 4px;
        }

        .header-action-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .header-action-btn:hover {
            background: var(--bg-hover);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 60px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 1;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        .message-group-start {
            margin-top: 16px;
        }

        .message-date-divider {
            text-align: center;
            margin: 16px 0;
        }

        .message-date-divider span {
            background: rgba(42, 42, 42, 0.8);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .message-wrapper {
            display: flex;
            margin-bottom: 2px;
        }

        .message-wrapper.sent {
            justify-content: flex-end;
        }

        .message-wrapper.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 480px;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message-wrapper.sent .message-bubble {
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 12px rgba(229, 57, 53, 0.2);
        }

        .message-wrapper.received .message-bubble {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 6px;
        }

        .message-bubble .msg-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .message-wrapper.sent .message-bubble .msg-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .message-status {
            margin-left: 4px;
            font-size: 12px;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1;
        }

        .input-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            flex-shrink: 0;
        }

        .input-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .message-input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px var(--red-subtle);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(229, 57, 53, 0.4);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .empty-state-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--red-subtle), rgba(229, 57, 53, 0.05));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin-bottom: 24px;
        }

        .empty-state h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== SIDEBAR MENU (PROFILE) ===== */
        .sidebar-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-menu-overlay.active {
            display: block;
            opacity: 1;
        }

        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100vh;
            background: var(--bg-secondary);
            z-index: 101;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-menu.active {
            left: 0;
        }

        .menu-profile {
            padding: 28px 24px;
            background: linear-gradient(135deg, rgba(229, 57, 53, 0.15), rgba(229, 57, 53, 0.05));
            border-bottom: 1px solid var(--border-color);
        }

        .menu-profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            box-shadow: 0 4px 20px rgba(229, 57, 53, 0.3);
        }

        .menu-profile h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-profile p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .menu-items {
            flex: 1;
            padding: 12px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 24px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 16px;
            font-size: 15px;
            color: var(--text-primary);
        }

        .menu-item:hover {
            background: var(--bg-hover);
        }

        .menu-item .menu-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            color: var(--red-primary);
        }

        .menu-item.logout {
            color: var(--red-secondary);
        }

        .menu-item.logout .menu-icon {
            color: var(--red-secondary);
        }

        /* ===== PROFILE MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 400px;
            max-width: 90vw;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
        }

        .modal-close:hover {
            background: var(--bg-hover);
        }

        .modal-body {
            padding: 24px;
        }

        .profile-card {
            text-align: center;
            margin-bottom: 24px;
        }

        .profile-card .p-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            box-shadow: 0 4px 24px rgba(229, 57, 53, 0.3);
            margin-bottom: 16px;
        }

        .profile-card h4 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-card p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== NEW CHAT MODAL ===== */
        .new-chat-search {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
        }

        .new-chat-search:focus {
            border-color: var(--red-primary);
        }

        .contact-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
        }

        .contact-item:hover {
            background: var(--bg-hover);
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
        }

        .contact-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .toast.success {
            background: #1b5e20;
            color: #c8e6c9;
            border: 1px solid #2e7d32;
        }

        .toast.error {
            background: var(--red-dark);
            color: #ffcdd2;
            border: 1px solid var(--red-primary);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: none;
            padding: 4px 0;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: inline-flex;
            gap: 3px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-width: 100%;
            }

            .main-chat {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: none;
            }

            .main-chat.mobile-active {
                display: flex;
            }

            .messages-area {
                padding: 16px 16px;
            }

            .back-btn {
                display: flex !important;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        .back-btn {
            display: none;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
        }

        /* Scrollbar for chat list too */
        .contact-list::-webkit-scrollbar {
            width: 4px;
        }

        .contact-list::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        /* Profile edit fields */
        .profile-edit-field {
            margin-bottom: 16px;
        }

        .profile-edit-field label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-edit-field input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        .profile-edit-field input:focus {
            border-color: var(--red-primary);
        }

        /* Emoji picker simplified */
        .emoji-bar {
            display: flex;
            gap: 2px;
            padding: 4px 0;
        }

        .emoji-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 18px;
            transition: background 0.2s;
        }

        .emoji-btn:hover {
            background: var(--bg-hover);
        }

        /* Notification dot */
        .notif-dot {
            width: 8px;
            height: 8px;
            background: var(--red-primary);
            border-radius: 50%;
            display: inline-block;
            animation: notifPulse 2s infinite;
        }

        @keyframes notifPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div class="auth-screen" id="authScreen">
    <div class="auth-container">
        <div class="auth-logo">
            <div class="logo-icon">🔥</div>
            <h1>RDMessenger</h1>
            <p>Безопасный мессенджер нового поколения</p>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchAuthTab('login')">Вход</div>
            <div class="auth-tab" onclick="switchAuthTab('register')">Регистрация</div>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Имя пользователя или Email</label>
                <input type="text" id="loginUsername" placeholder="Введите имя пользователя" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn-primary">Войти</button>
            <div class="auth-error" id="loginError"></div>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Отображаемое имя</label>
                <input type="text" id="regDisplayName" placeholder="Ваше имя" required>
            </div>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="regUsername" placeholder="Придумайте username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="Минимум 6 символов" minlength="6" required>
            </div>
            <div class="form-group">
                <label>О себе (необязательно)</label>
                <input type="text" id="regBio" placeholder="Расскажите о себе...">
            </div>
            <button type="submit" class="btn-primary">Создать аккаунт</button>
            <div class="auth-error" id="registerError"></div>
            <div class="auth-success" id="registerSuccess"></div>
        </form>
    </div>
</div>

<!-- ===== APP SCREEN ===== -->
<div class="app-screen" id="appScreen">
    <!-- Sidebar Menu (hamburger) -->
    <div class="sidebar-menu-overlay" id="menuOverlay" onclick="closeSidebarMenu()"></div>
    <div class="sidebar-menu" id="sidebarMenu">
        <div class="menu-profile" id="menuProfileArea">
            <div class="menu-profile-avatar" id="menuAvatar">👤</div>
            <h3 id="menuName">Имя пользователя</h3>
            <p id="menuBio">В сети</p>
        </div>
        <div class="menu-items">
            <div class="menu-item" onclick="openProfileModal()">
                <span class="menu-icon">👤</span>
                <span>Мой профиль</span>
            </div>
            <div class="menu-item" onclick="openNewChatModal()">
                <span class="menu-icon">➕</span>
                <span>Новый чат</span>
            </div>
            <div class="menu-item">
                <span class="menu-icon">⚙️</span>
                <span>Настройки</span>
            </div>
            <div class="menu-item">
                <span class="menu-icon">🎨</span>
                <span>Оформление</span>
            </div>
            <div class="menu-item logout" onclick="handleLogout()">
                <span class="menu-icon">🚪</span>
                <span>Выйти</span>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" onclick="openSidebarMenu()">☰</button>
            <span class="app-title">RDMessenger</span>
            <div class="header-actions">
                <button class="header-action-btn" onclick="openNewChatModal()" title="Новый чат">✏️</button>
            </div>
        </div>
        <div class="search-container">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-box" placeholder="Поиск чатов..." id="chatSearch" oninput="filterChats()">
            </div>
        </div>
        <div class="chat-list" id="chatList">
            <!-- Chats will be rendered here -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-chat" id="mainChat">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">💬</div>
            <h2>RDMessenger</h2>
            <p>Выберите чат, чтобы начать общение</p>
        </div>

        <!-- Chat View (hidden by default) -->
        <div id="chatView" style="display:none; flex-direction:column; height:100%;">
            <div class="chat-header">
                <div style="display:flex;align-items:center;">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div class="chat-header-info">
                        <div class="chat-header-avatar-wrapper">
                            <div class="chat-header-avatar" id="chatHeaderAvatar">👤</div>
                            <div class="online-dot" id="chatHeaderOnline" style="display:none;"></div>
                        </div>
                        <div class="chat-header-details">
                            <h3 id="chatHeaderName">Имя контакта</h3>
                            <span id="chatHeaderStatus">в сети</span>
                        </div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="header-action-btn" title="Поиск">🔍</button>
                    <button class="header-action-btn" title="Звонок">📞</button>
                    <button class="header-action-btn" title="Ещё">⋯</button>
                </div>
            </div>

            <div class="messages-area" id="messagesArea">
                <!-- Messages rendered here -->
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="input-area">
                <button class="input-btn" title="Эмодзи">😊</button>
                <div class="message-input-wrapper">
                    <input type="text" class="message-input" id="messageInput" placeholder="Написать сообщение..." onkeydown="handleMessageKey(event)">
                </div>
                <button class="input-btn" title="Прикрепить">📎</button>
                <button class="send-btn" onclick="sendMessage()" title="Отправить">➤</button>
            </div>
        </div>
    </div>
</div>
